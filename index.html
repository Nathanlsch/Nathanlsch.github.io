```html
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️ Mon mur</title>
</head>

<body>

    <!-- ========================================= -->
    <!-- CONNEXION -->
    <!-- ========================================= -->

    <div id="login">

        <h1>❤️ Mon mur</h1>

        <h2>Connexion</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
        >

        <button id="loginButton">
            Entrer ❤️
        </button>

        <p id="error"></p>

    </div>


    <!-- ========================================= -->
    <!-- UTILISATEUR CONNECTÉ -->
    <!-- ========================================= -->

    <div id="loggedIn" style="display: none;">

        <h1>Bienvenue ❤️</h1>

        <p id="userEmail"></p>

        <button id="logoutButton">
            Se déconnecter
        </button>


        <!-- ===================================== -->
        <!-- TEST DES POST-IT -->
        <!-- ===================================== -->

        <hr>

        <h2>Test des post-it</h2>

        <p>
            Choisis un numéro entre 1 et 140.
        </p>

        <input
            type="number"
            id="postitId"
            min="1"
            max="140"
            placeholder="ID du post-it"
        >

        <button id="openPostitButton">
            Ouvrir
        </button>

        <p id="postitResult"></p>

    </div>


    <!-- ========================================= -->
    <!-- SUPABASE -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <!-- ========================================= -->
    <!-- APPLICATION -->
    <!-- ========================================= -->

    <script>

        // ========================================
        // ELEMENTS HTML
        // ========================================

        const loginDiv =
            document.getElementById("login");

        const loggedInDiv =
            document.getElementById("loggedIn");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const errorText =
            document.getElementById("error");

        const userEmail =
            document.getElementById("userEmail");

        const postitIdInput =
            document.getElementById("postitId");

        const openPostitButton =
            document.getElementById("openPostitButton");

        const postitResult =
            document.getElementById("postitResult");


        // ========================================
        // AFFICHER LA PAGE CONNECTÉE
        // ========================================

        function showLoggedIn(user) {

            loginDiv.style.display = "none";

            loggedInDiv.style.display = "block";

            userEmail.textContent =
                "Connecté avec : " + user.email;

            errorText.textContent = "";
        }


        // ========================================
        // AFFICHER LA PAGE DE CONNEXION
        // ========================================

        function showLogin() {

            loginDiv.style.display = "block";

            loggedInDiv.style.display = "none";

            userEmail.textContent = "";

            postitResult.textContent = "";
        }


        // ========================================
        // VERIFIER L'UTILISATEUR
        // ========================================

        async function checkUser() {

            const {
                data: { user },
                error
            } = await supabaseClient.auth.getUser();

            if (error) {

                console.error(
                    "Erreur récupération utilisateur :",
                    error
                );

                showLogin();

                return;
            }

            if (user) {

                showLoggedIn(user);

            } else {

                showLogin();

            }
        }


        // ========================================
        // CONNEXION
        // ========================================

        async function login() {

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            errorText.textContent = "";

            if (!email || !password) {

                errorText.textContent =
                    "Entre ton email et ton mot de passe.";

                return;
            }


            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {

                console.error(
                    "Erreur Supabase :",
                    error
                );

                errorText.textContent =
                    error.message;

                return;
            }


            showLoggedIn(data.user);
        }


        // ========================================
        // DECONNEXION
        // ========================================

        async function logout() {

            const {
                error
            } = await supabaseClient.auth.signOut();


            if (error) {

                console.error(
                    "Erreur déconnexion :",
                    error
                );

                return;
            }


            showLogin();
        }


        // ========================================
        // OUVRIR UN POST-IT
        // ========================================

        async function openPostit() {

            postitResult.textContent = "";


            const postitId =
                Number(postitIdInput.value);


            // Vérification de l'ID

            if (
                !postitId ||
                postitId < 1 ||
                postitId > 140 ||
                !Number.isInteger(postitId)
            ) {

                postitResult.textContent =
                    "Entre un ID entier entre 1 et 140.";

                return;
            }


            // Appel de la fonction PostgreSQL

            const {
                data,
                error
            } = await supabaseClient.rpc(
                "open_postit",
                {
                    p_postit_id: postitId
                }
            );


            // Gestion des erreurs

            if (error) {

                console.error(
                    "Erreur ouverture post-it :",
                    error
                );


                if (
                    error.message.includes(
                        "ALREADY_OPENED_TODAY"
                    )
                ) {

                    postitResult.textContent =
                        "Tu as déjà ouvert un post-it aujourd'hui ❤️";

                }

                else if (
                    error.message.includes(
                        "POSTIT_ALREADY_OPENED"
                    )
                ) {

                    postitResult.textContent =
                        "Tu as déjà ouvert ce post-it ❤️";

                }

                else if (
                    error.message.includes(
                        "POSTIT_NOT_FOUND"
                    )
                ) {

                    postitResult.textContent =
                        "Ce post-it n'existe pas.";

                }

                else if (
                    error.message.includes(
                        "NOT_AUTHENTICATED"
                    )
                ) {

                    postitResult.textContent =
                        "Tu dois être connecté.";

                    showLogin();

                }

                else {

                    postitResult.textContent =
                        "Une erreur est survenue.";

                }

                return;
            }


            // Succès

            console.log(
                "Ouverture enregistrée :",
                data
            );


            postitResult.textContent =
                "Post-it #" +
                postitId +
                " ouvert ❤️";


            // On vide le champ

            postitIdInput.value = "";
        }


        // ========================================
        // EVENEMENTS
        // ========================================

        loginButton.addEventListener(
            "click",
            login
        );


        logoutButton.addEventListener(
            "click",
            logout
        );


        openPostitButton.addEventListener(
            "click",
            openPostit
        );


        // Permettre d'appuyer sur ENTER
        // dans le champ mot de passe

        passwordInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    login();

                }

            }
        );


        // Permettre d'appuyer sur ENTER
        // dans le champ du post-it

        postitIdInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    openPostit();

                }

            }
        );


        // ========================================
        // INITIALISATION
        // ========================================

        checkUser();

    </script>

</body>

</html>
```
