<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ========================================= -->
    <!-- PAGE DE CONNEXION                         -->
    <!-- ========================================= -->

    <section id="login">

        <div class="login-card">

            <div class="login-heart">♥</div>

            <h1>Mon petit mur</h1>

            <p class="login-subtitle">
                Il y a quelque chose qui t'attend ici...
            </p>

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Entrer ❤️
            </button>

            <p id="error"></p>

        </div>

    </section>


    <!-- ========================================= -->
    <!-- MUR                                      -->
    <!-- ========================================= -->

    <main id="wallPage" style="display: none;">

        <header class="wall-header">

            <div>

                <h1>❤️</h1>

                <p id="progressText">
                    0 / 140
                </p>

            </div>

            <button
                id="logoutButton"
                class="logout-button"
            >
                ×
            </button>

        </header>


        <section
            id="wall"
            class="wall"
        >
        </section>


        <p
            id="wallMessage"
            class="wall-message"
        ></p>

    </main>


    <!-- ========================================= -->
    <!-- MODAL DU POST-IT                         -->
    <!-- ========================================= -->

    <div
        id="postitModal"
        class="modal hidden"
    >

        <div
            class="modal-background"
            id="modalBackground"
        ></div>


        <div class="modal-content">

            <button
                id="closeModal"
                class="close-modal"
            >
                ×
            </button>


            <div
                id="modalHeart"
                class="modal-heart"
            >
                ♥
            </div>


            <div
                id="modalNumber"
                class="modal-number"
            >
                #1
            </div>


            <div
                id="modalMessage"
                class="modal-message"
            >
            </div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- SUPABASE                                 -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <!-- ========================================= -->
    <!-- APPLICATION                              -->
    <!-- ========================================= -->

    <script>

        // ========================================
        // ELEMENTS
        // ========================================

        const loginPage =
            document.getElementById("login");

        const wallPage =
            document.getElementById("wallPage");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const errorText =
            document.getElementById("error");

        const wall =
            document.getElementById("wall");

        const progressText =
            document.getElementById("progressText");

        const wallMessage =
            document.getElementById("wallMessage");

        const modal =
            document.getElementById("postitModal");

        const modalBackground =
            document.getElementById("modalBackground");

        const closeModalButton =
            document.getElementById("closeModal");

        const modalHeart =
            document.getElementById("modalHeart");

        const modalNumber =
            document.getElementById("modalNumber");

        const modalMessage =
            document.getElementById("modalMessage");


        // ========================================
        // DONNEES
        // ========================================

        let postits = [];

        let openedPostits = new Set();

        let user = null;


        // ========================================
        // COULEURS
        // ========================================

        const heartColors = [
            "pink",
            "rose",
            "red",
            "purple",
            "blue",
            "yellow",
            "orange"
        ];


        // ========================================
        // CONNEXION
        // ========================================

        async function login() {

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            errorText.textContent = "";


            if (!email || !password) {

                errorText.textContent =
                    "Entre ton email et ton mot de passe.";

                return;
            }


            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {

                console.error(error);

                errorText.textContent =
                    "Email ou mot de passe incorrect.";

                return;
            }


            user = data.user;

            await startWall();

        }


        // ========================================
        // DECONNEXION
        // ========================================

        async function logout() {

            await supabaseClient.auth.signOut();

            user = null;

            postits = [];

            openedPostits.clear();

            wall.innerHTML = "";

            wallPage.style.display = "none";

            loginPage.style.display = "flex";

        }


        // ========================================
        // INITIALISATION
        // ========================================

        async function checkUser() {

            const {
                data: {
                    user: currentUser
                }
            } = await supabaseClient.auth.getUser();


            if (currentUser) {

                user = currentUser;

                await startWall();

            } else {

                loginPage.style.display = "flex";

                wallPage.style.display = "none";

            }

        }


        // ========================================
        // CHARGER LES DONNEES
        // ========================================

        async function startWall() {

            loginPage.style.display = "none";

            wallPage.style.display = "block";


            await loadPostits();

            await loadOpenedPostits();

            renderWall();

        }


        // ========================================
        // RECUPERER LES 140 POST-IT
        // ========================================

        async function loadPostits() {

            const {
                data,
                error
            } = await supabaseClient
                .from("postits")
                .select("id, message")
                .order("id", {
                    ascending: true
                });


            if (error) {

                console.error(
                    "Erreur chargement post-its :",
                    error
                );

                wallMessage.textContent =
                    "Impossible de charger le mur.";

                return;
            }


            postits = data || [];

        }


        // ========================================
        // RECUPERER LES POST-IT DEJA OUVERTS
        // ========================================

        async function loadOpenedPostits() {

            const {
                data,
                error
            } = await supabaseClient
                .from("opened_postits")
                .select("postit_id")
                .eq("user_id", user.id);


            if (error) {

                console.error(
                    "Erreur chargement ouvertures :",
                    error
                );

                return;
            }


            openedPostits = new Set(
                data.map(item => item.postit_id)
            );

        }


        // ========================================
        // CREER LE MUR
        // ========================================

        function renderWall() {

            wall.innerHTML = "";


            postits.forEach(
                (postit, index) => {

                    const heart =
                        document.createElement("button");


                    heart.className =
                        "postit";


                    // --------------------------------
                    // Etat
                    // --------------------------------

                    if (
                        openedPostits.has(
                            postit.id
                        )
                    ) {

                        heart.classList.add(
                            "opened"
                        );

                    }


                    // --------------------------------
                    // Couleur
                    // --------------------------------

                    const color =
                        heartColors[
                            index %
                            heartColors.length
                        ];


                    heart.classList.add(
                        color
                    );


                    // --------------------------------
                    // Rotation aléatoire
                    // --------------------------------

                    const rotation =
                        Math.random() * 10 - 5;


                    const translationX =
                        Math.random() * 8 - 4;


                    const translationY =
                        Math.random() * 8 - 4;


                    heart.style.setProperty(
                        "--rotation",
                        rotation + "deg"
                    );


                    heart.style.setProperty(
                        "--translate-x",
                        translationX + "px"
                    );


                    heart.style.setProperty(
                        "--translate-y",
                        translationY + "px"
                    );


                    // --------------------------------
                    // Numéro
                    // --------------------------------

                    heart.innerHTML = `
                        <span>
                            ${postit.id}
                        </span>
                    `;


                    // --------------------------------
                    // Clic
                    // --------------------------------

                    heart.addEventListener(
                        "click",
                        () => {

                            handlePostitClick(
                                postit,
                                heart
                            );

                        }
                    );


                    wall.appendChild(heart);

                }
            );


            updateProgress();

        }


        // ========================================
        // CLIC SUR UN POST-IT
        // ========================================

        async function handlePostitClick(
            postit,
            element
        ) {

            // --------------------------------
            // Déjà ouvert
            // --------------------------------

            if (
                openedPostits.has(
                    postit.id
                )
            ) {

                showPostit(
                    postit,
                    element
                );

                return;
            }


            // --------------------------------
            // Nouveau post-it
            // --------------------------------

            element.classList.add(
                "loading"
            );


            const {
                data,
                error
            } = await supabaseClient.rpc(
                "open_postit",
                {
                    p_postit_id: postit.id
                }
            );


            element.classList.remove(
                "loading"
            );


            // --------------------------------
            // Erreur
            // --------------------------------

            if (error) {

                console.error(error);


                if (
                    error.message.includes(
                        "ALREADY_OPENED_TODAY"
                    )
                ) {

                    showWallMessage(
                        "Tu as déjà ouvert ton petit mot aujourd'hui ❤️"
                    );

                }

                else if (
                    error.message.includes(
                        "POSTIT_ALREADY_OPENED"
                    )
                ) {

                    openedPostits.add(
                        postit.id
                    );

                    element.classList.add(
                        "opened"
                    );

                    showPostit(
                        postit,
                        element
                    );

                }

                else {

                    showWallMessage(
                        "Une petite erreur est survenue..."
                    );

                }


                return;
            }


            // --------------------------------
            // Succès
            // --------------------------------

            openedPostits.add(
                postit.id
            );


            element.classList.add(
                "opened"
            );


            updateProgress();


            showPostit(
                postit,
                element
            );

        }


        // ========================================
        // AFFICHER LE MESSAGE
        // ========================================

        function showPostit(
            postit,
            element
        ) {

            modalNumber.textContent =
                "#" + postit.id;


            modalMessage.textContent =
                postit.message;


            // Récupérer la couleur

            const colorClass =
                heartColors.find(
                    color =>
                        element.classList.contains(
                            color
                        )
                );


            modalHeart.className =
                "modal-heart " +
                (colorClass || "pink");


            modal.classList.remove(
                "hidden"
            );


            document.body.classList.add(
                "modal-open"
            );

        }


        // ========================================
        // FERMER LE MESSAGE
        // ========================================

        function closeModal() {

            modal.classList.add(
                "hidden"
            );

            document.body.classList.remove(
                "modal-open"
            );

        }


        // ========================================
        // PROGRESSION
        // ========================================

        function updateProgress() {

            progressText.textContent =
                openedPostits.size +
                " / 140";

        }


        // ========================================
        // MESSAGE SUR LE MUR
        // ========================================

        function showWallMessage(
            message
        ) {

            wallMessage.textContent =
                message;


            wallMessage.classList.add(
                "visible"
            );


            setTimeout(
                () => {

                    wallMessage.classList.remove(
                        "visible"
                    );

                },
                3500
            );

        }


        // ========================================
        // EVENEMENTS
        // ========================================

        loginButton.addEventListener(
            "click",
            login
        );


        logoutButton.addEventListener(
            "click",
            logout
        );


        closeModalButton.addEventListener(
            "click",
            closeModal
        );


        modalBackground.addEventListener(
            "click",
            closeModal
        );


        passwordInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    login();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );


        // ========================================
        // START
        // ========================================

        checkUser();

    </script>

</body>

</html>
