<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>❤️</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================================
         PAGE DE CONNEXION
    ========================================== -->

    <section id="login">

        <div class="login-card">

            <div class="login-heart">♥</div>

            <h1>Mon petit mur</h1>

            <p class="login-subtitle">
                Il y a quelque chose qui t'attend ici...
            </p>

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Entrer ❤️
            </button>

            <p id="error"></p>

        </div>

    </section>


    <!-- =========================================
         PAGE PRINCIPALE
    ========================================== -->

    <main id="wallPage">

        <!-- HEADER -->

        <header class="wall-header">

            <div class="header-left">

                <h1>❤️</h1>

                <p id="progressText">
                    0 / 140
                </p>

            </div>


            <button
                id="logoutButton"
                class="logout-button"
                aria-label="Déconnexion"
            >
                ×
            </button>

        </header>


        <!-- MUR -->

        <section
            id="wall"
            class="wall"
        ></section>


        <!-- MESSAGE TEMPORAIRE -->

        <p
            id="wallMessage"
            class="wall-message"
        ></p>

    </main>


    <!-- =========================================
         MODAL
    ========================================== -->

    <div
        id="postitModal"
        class="modal hidden"
    >

        <div
            id="modalBackground"
            class="modal-background"
        ></div>


        <div class="modal-content">

            <button
                id="closeModal"
                class="close-modal"
                aria-label="Fermer"
            >
                ×
            </button>


            <div
                id="modalHeart"
                class="modal-heart pink"
            ></div>


            <div
                id="modalNumber"
                class="modal-number"
            >
                #1
            </div>


            <div
                id="modalMessage"
                class="modal-message"
            ></div>

        </div>

    </div>


    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <!-- =========================================
         APPLICATION
    ========================================== -->

    <script>

        // ========================================
        // ELEMENTS HTML
        // ========================================

        const loginPage =
            document.getElementById("login");

        const wallPage =
            document.getElementById("wallPage");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const errorText =
            document.getElementById("error");

        const wall =
            document.getElementById("wall");

        const progressText =
            document.getElementById("progressText");

        const wallMessage =
            document.getElementById("wallMessage");

        const modal =
            document.getElementById("postitModal");

        const modalBackground =
            document.getElementById("modalBackground");

        const closeModalButton =
            document.getElementById("closeModal");

        const modalHeart =
            document.getElementById("modalHeart");

        const modalNumber =
            document.getElementById("modalNumber");

        const modalMessage =
            document.getElementById("modalMessage");


        // ========================================
        // VARIABLES
        // ========================================

        let user = null;

        let postits = [];

        let openedPostits = new Set();


        // ========================================
        // COULEURS DES COEURS
        // ========================================

        const heartColors = [
            "pink",
            "rose",
            "red",
            "purple",
            "blue",
            "yellow",
            "orange"
        ];


        // ========================================
        // AFFICHER LA PAGE DE CONNEXION
        // ========================================

        function showLogin() {

            loginPage.style.display = "flex";

            wallPage.style.display = "none";

        }


        // ========================================
        // AFFICHER LE MUR
        // ========================================

        function showWall() {

            loginPage.style.display = "none";

            wallPage.style.display = "block";

        }


        // ========================================
        // CONNEXION
        // ========================================

        async function login() {

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            errorText.textContent = "";


            if (!email || !password) {

                errorText.textContent =
                    "Entre ton email et ton mot de passe.";

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Connexion...";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            loginButton.disabled = false;

            loginButton.textContent =
                "Entrer ❤️";


            if (error) {

                console.error(
                    "Erreur connexion :",
                    error
                );

                errorText.textContent =
                    "Email ou mot de passe incorrect.";

                return;
            }


            user = data.user;

            await startApplication();

        }


        // ========================================
        // DECONNEXION
        // ========================================

        async function logout() {

            await supabaseClient.auth.signOut();


            user = null;

            postits = [];

            openedPostits.clear();

            wall.innerHTML = "";


            showLogin();

        }


        // ========================================
        // VERIFIER LA SESSION
        // ========================================

        async function checkUser() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();


            if (error) {

                console.error(
                    "Erreur récupération session :",
                    error
                );

                showLogin();

                return;
            }


            if (data.user) {

                user = data.user;

                await startApplication();

            }

            else {

                showLogin();

            }

        }


        // ========================================
        // INITIALISATION DE L'APPLICATION
        // ========================================

        async function startApplication() {

            showWall();


            const postitsLoaded =
                await loadPostits();


            if (!postitsLoaded) {

                return;

            }


            const openedLoaded =
                await loadOpenedPostits();


            if (!openedLoaded) {

                return;

            }


            renderWall();

        }


        // ========================================
        // CHARGER LES POST-IT
        // ========================================

        async function loadPostits() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("postits")
                    .select("id, message")
                    .order("id", {
                        ascending: true
                    });


            if (error) {

                console.error(
                    "Erreur chargement post-it :",
                    error
                );

                showWallMessage(
                    "Impossible de charger les post-it."
                );

                return false;

            }


            postits = data || [];


            return true;

        }


        // ========================================
        // CHARGER LES POST-IT DEJA OUVERTS
        // ========================================

        async function loadOpenedPostits() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("opened_postits")
                    .select("postit_id")
                    .eq(
                        "user_id",
                        user.id
                    );


            if (error) {

                console.error(
                    "Erreur chargement ouvertures :",
                    error
                );

                showWallMessage(
                    "Impossible de récupérer les ouvertures."
                );

                return false;

            }


            openedPostits =
                new Set(
                    (data || []).map(
                        item => item.postit_id
                    )
                );


            return true;

        }


        // ========================================
        // GENERER LE MUR
        // ========================================

        function renderWall() {

            wall.innerHTML = "";


            postits.forEach(
                (postit, index) => {

                    const heart =
                        document.createElement("button");


                    heart.type = "button";


                    heart.classList.add(
                        "postit"
                    );


                    // --------------------------------
                    // COULEUR
                    // --------------------------------

                    const color =
                        heartColors[
                            index %
                            heartColors.length
                        ];


                    heart.classList.add(
                        color
                    );


                    // --------------------------------
                    // ROTATION
                    // --------------------------------

                    const rotation =
                        Math.random() * 10 - 5;


                    heart.style.setProperty(
                        "--rotation",
                        rotation + "deg"
                    );


                    // --------------------------------
                    // POST-IT DEJA OUVERT
                    // --------------------------------

                    if (
                        openedPostits.has(
                            postit.id
                        )
                    ) {

                        heart.classList.add(
                            "opened"
                        );

                    }


                    // --------------------------------
                    // NUMERO
                    // --------------------------------

                    const number =
                        document.createElement("span");


                    number.textContent =
                        postit.id;


                    heart.appendChild(
                        number
                    );


                    // --------------------------------
                    // CLIC
                    // --------------------------------

                    heart.addEventListener(
                        "click",
                        () => {

                            handlePostitClick(
                                postit,
                                heart
                            );

                        }
                    );


                    wall.appendChild(
                        heart
                    );

                }
            );


            updateProgress();

        }


        // ========================================
        // CLIC SUR UN POST-IT
        // ========================================

        async function handlePostitClick(
            postit,
            element
        ) {

            // --------------------------------
            // DEJA OUVERT
            // --------------------------------

            if (
                openedPostits.has(
                    postit.id
                )
            ) {

                showPostit(
                    postit,
                    element
                );

                return;

            }


            // --------------------------------
            // CHARGEMENT
            // --------------------------------

            element.classList.add(
                "loading"
            );


            element.disabled = true;


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "open_postit",
                    {
                        p_postit_id:
                            postit.id
                    }
                );


            element.classList.remove(
                "loading"
            );


            element.disabled = false;


            // --------------------------------
            // ERREUR
            // --------------------------------

            if (error) {

                console.error(
                    "Erreur ouverture :",
                    error
                );


                if (
                    error.message.includes(
                        "ALREADY_OPENED_TODAY"
                    )
                ) {

                    showWallMessage(
                        "Tu as déjà ouvert ton petit mot aujourd'hui ❤️"
                    );

                }

                else if (
                    error.message.includes(
                        "POSTIT_ALREADY_OPENED"
                    )
                ) {

                    openedPostits.add(
                        postit.id
                    );

                    element.classList.add(
                        "opened"
                    );

                    updateProgress();


                    showPostit(
                        postit,
                        element
                    );

                }

                else if (
                    error.message.includes(
                        "NOT_AUTHENTICATED"
                    )
                ) {

                    showLogin();

                }

                else {

                    showWallMessage(
                        "Une erreur est survenue..."
                    );

                }


                return;

            }


            // --------------------------------
            // SUCCES
            // --------------------------------

            openedPostits.add(
                postit.id
            );


            element.classList.add(
                "opened"
            );


            updateProgress();


            showPostit(
                postit,
                element
            );

        }


        // ========================================
        // AFFICHER LE MESSAGE
        // ========================================

        function showPostit(
            postit,
            element
        ) {

            modalNumber.textContent =
                "#" + postit.id;


            modalMessage.textContent =
                postit.message;


            // --------------------------------
            // COULEUR
            // --------------------------------

            const color =
                heartColors.find(
                    item =>
                        element.classList.contains(
                            item
                        )
                ) || "pink";


            modalHeart.className =
                "modal-heart " + color;


            modal.classList.remove(
                "hidden"
            );


            document.body.classList.add(
                "modal-open"
            );

        }


        // ========================================
        // FERMER LE MODAL
        // ========================================

        function closeModal() {

            modal.classList.add(
                "hidden"
            );


            document.body.classList.remove(
                "modal-open"
            );

        }


        // ========================================
        // PROGRESSION
        // ========================================

        function updateProgress() {

            progressText.textContent =
                openedPostits.size +
                " / 140";

        }


        // ========================================
        // MESSAGE TEMPORAIRE
        // ========================================

        function showWallMessage(
            message
        ) {

            wallMessage.textContent =
                message;


            wallMessage.classList.add(
                "visible"
            );


            setTimeout(
                () => {

                    wallMessage.classList.remove(
                        "visible"
                    );

                },
                3500
            );

        }


        // ========================================
        // EVENEMENTS
        // ========================================

        loginButton.addEventListener(
            "click",
            login
        );


        logoutButton.addEventListener(
            "click",
            logout
        );


        closeModalButton.addEventListener(
            "click",
            closeModal
        );


        modalBackground.addEventListener(
            "click",
            closeModal
        );


        passwordInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    login();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );


        // ========================================
        // DEMARRAGE
        // ========================================

        checkUser();

    </script>

</body>

</html>
